name: Build mod

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.0"

      - name: Build
        run: set -o pipefail; gradle build --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Show the cause
        if: failure()
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E "error:|What went wrong" -A2 build.log | head -60 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ytmusic-ingame
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            build.log
