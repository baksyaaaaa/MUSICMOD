name: Build mod

on:
  push:
  workflow_dispatch:

permissions:
  contents: write   # lets the build publish the jar as a GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.0"

      - name: Build
        run: set -o pipefail; gradle build --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Show the cause
        if: failure()
        run: |
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E "error:|What went wrong" -A2 build.log | head -60 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ytmusic-ingame
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            build.log

      - name: Publish the jar as a GitHub Release (the launcher downloads it from here)
        if: success() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep '^mod_version=' gradle.properties | cut -d= -f2)
          JAR=$(ls build/libs/*.jar | grep -v -- '-sources' | head -n1)
          TAG="v$VER"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$JAR" --clobber
          else
            gh release create "$TAG" "$JAR" --title "YT Music In-Game $VER" --notes "Minecraft 1.21.11" --latest
          fi
